<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .aprovado {
            background-color: #cce5ff;
            color: blue;
        }

        .exame {
            background-color: #d4edda;
            color: green;
        }

        .reprovado {
            background-color: #f8d7da;
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema Acadêmico</h1>

        <input type="text" id="nome" placeholder="Nome do aluno">

        <input type="number" id="nota1" placeholder="Nota 1">

        <input type="number" id="nota2" placeholder="Nota 2">

        <input type="number" id="nota3" placeholder="Nota 3">

        <button id="calcular">Calcular Média</button>

        <div id="resultado"></div>
    </div>

    <script>

        const botao = document.getElementById("calcular");

        botao.addEventListener("click", function() {

            const nome = document.getElementById("nome").value;

            const nota1 = Number(document.getElementById("nota1").value);
            const nota2 = Number(document.getElementById("nota2").value);
            const nota3 = Number(document.getElementById("nota3").value);

            const media = (nota1 + nota2 + nota3) / 3;

            const resultado = document.getElementById("resultado");

            if (media >= 7 && media <= 10) {

                resultado.innerHTML = `
                    Aluno: ${nome}<br>
                    Média: ${media.toFixed(2)}<br>
                    Situação: APROVADO
                `;

                resultado.className = "aprovado";

            } else if (media >= 4 && media < 7) {

                const falta = (10 - media).toFixed(2);

                resultado.innerHTML = `
                    Aluno: ${nome}<br>
                    Média: ${media.toFixed(2)}<br>
                    Situação: EXAME<br>
                    Faltam ${falta} pontos para chegar a 10
                `;

                resultado.className = "exame";

            } else {

                resultado.innerHTML = `
                    Aluno: ${nome}<br>
                    Média: ${media.toFixed(2)}<br>
                    Situação: REPROVADO
                `;

                resultado.className = "reprovado";
            }

        });

    </script>

</body>
</html>
