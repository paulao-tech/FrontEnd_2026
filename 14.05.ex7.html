<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Guard - Análise de Cartão</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: white;
            width: 430px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #111827;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background-color: #374151;
        }

        #painel {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eef6ff;
            line-height: 1.8;
            font-weight: bold;
            display: none;
        }

        .valido {
            color: green;
        }

        .invalido {
            color: red;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Card Guard</h1>
        <p>Análise de cartão de crédito</p>

        <label for="cartao">Número do cartão</label>
        <input type="text" id="cartao" maxlength="19" placeholder="Digite até 16 dígitos">

        <button id="analisar">Analisar Cartão</button>

        <div id="painel"></div>
    </div>

    <script>
        const botao = document.getElementById("analisar");

        botao.addEventListener("click", function() {
            const entrada = document.getElementById("cartao").value;

            const numero = entrada.replace(/[ .]/g, "");

            const painel = document.getElementById("painel");

            painel.style.display = "block";

            if (!/^\d{13,16}$/.test(numero)) {
                painel.innerHTML = `
                    <span class="invalido">Status: Inválido</span><br>
                    Bandeira: Não identificada<br>
                    Categoria de Setor: Não identificada<br>
                    Banco Emissor: Não identificado
                `;
                return;
            }

            const valido = validarLuhn(numero);
            const bandeira = identificarBandeira(numero);
            const setor = identificarSetor(numero);
            const banco = identificarBanco(numero);

            painel.innerHTML = `
                <span class="${valido ? "valido" : "invalido"}">
                    Status: ${valido ? "Válido" : "Inválido"}
                </span><br>
                Bandeira: ${bandeira}<br>
                Categoria de Setor: ${setor}<br>
                Banco Emissor: ${banco}
            `;
        });

        function validarLuhn(numero) {
            const digitosInvertidos = numero.split("").reverse();

            let soma = 0;

            for (let i = 0; i < digitosInvertidos.length; i++) {
                let digito = Number(digitosInvertidos[i]);

                if ((i + 1) % 2 === 0) {
                    digito = digito * 2;

                    if (digito > 9) {
                        digito = digito - 9;
                    }
                }

                soma = soma + digito;
            }

            return soma % 10 === 0;
        }

        function identificarBandeira(numero) {
            if (numero.startsWith("4")) {
                return "Visa";
            } else if (
                numero.startsWith("51") ||
                numero.startsWith("52") ||
                numero.startsWith("53") ||
                numero.startsWith("54") ||
                numero.startsWith("55")
            ) {
                return "MasterCard";
            } else if (
                numero.startsWith("34") ||
                numero.startsWith("37")
            ) {
                return "American Express";
            } else if (
                numero.startsWith("36") ||
                numero.startsWith("38")
            ) {
                return "Diners Club";
            } else if (
                numero.startsWith("60") ||
                numero.startsWith("65")
            ) {
                return "Discover";
            } else if (
                numero.startsWith("4011") ||
                numero.startsWith("4312") ||
                numero.startsWith("4389")
            ) {
                return "Elo";
            } else {
                return "Não identificada";
            }
        }

        function identificarSetor(numero) {
            const primeiroDigito = numero.charAt(0);

            switch (primeiroDigito) {
                case "1":
                case "2":
                    return "Companhias aéreas e viagens";

                case "3":
                    return "Viagens, entretenimento e serviços financeiros";

                case "4":
                case "5":
                    return "Bancos e instituições financeiras";

                case "6":
                    return "Comércio e bancos";

                case "7":
                    return "Petróleo e combustível";

                case "8":
                    return "Telecomunicações e saúde";

                case "9":
                    return "Uso nacional ou governamental";

                default:
                    return "Não identificada";
            }
        }

        function identificarBanco(numero) {
            const iin = numero.substring(0, 8);

            if (numero.startsWith("4")) {
                return "Banco emissor Visa - IIN " + iin;
            } else if (
                numero.startsWith("51") ||
                numero.startsWith("52") ||
                numero.startsWith("53") ||
                numero.startsWith("54") ||
                numero.startsWith("55")
            ) {
                return "Banco emissor MasterCard - IIN " + iin;
            } else if (
                numero.startsWith("34") ||
                numero.startsWith("37")
            ) {
                return "American Express - IIN " + iin;
            } else if (
                numero.startsWith("60") ||
                numero.startsWith("65")
            ) {
                return "Discover - IIN " + iin;
            } else {
                return "Emissor desconhecido - IIN " + iin;
            }
        }
    </script>

</body>
</html>
